name: Build Installer (Windows)

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check repository variables
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_PUBLIC_URL" ]; then
            echo "::error::Variable 'R2_PUBLIC_URL' is not set in the repository (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check package.json version against the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "::error::package.json is at $PKG_VERSION but the tag is $TAG. The installer would ship with the wrong version and break auto-update."
            exit 1
          fi

      - name: Build app
        run: npm run build

      - name: Build installer
        run: |
          mkdir -p installer/src-tauri/payload
          cp src-tauri/target/release/orchestra.exe installer/src-tauri/payload/orchestra.exe
          cd installer
          npx tauri build

      - name: Sign installer
        env:
          TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          SETUP="dist/Orchestra_${TAG#v}_x64-setup.exe"
          cp installer/src-tauri/target/release/orchestra-setup.exe "$SETUP"
          npx tauri signer sign "$SETUP"
          test -s "$SETUP.sig"

      - name: Generate latest.json
        env:
          TAG: ${{ inputs.tag }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          git log -1 --format=%b > dist/notes.md
          node -e '
            const fs = require("node:fs");
            const setup = fs.readdirSync("dist").find((f) => f.endsWith("-setup.exe"));
            const manifest = {
              version: process.env.TAG.replace(/^v/, ""),
              notes: fs.readFileSync("dist/notes.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(`dist/${setup}.sig`, "utf8").trim(),
                  url: `${process.env.R2_PUBLIC_URL}/releases/${setup}`,
                },
              },
            };
            fs.writeFileSync("dist/latest.json", JSON.stringify(manifest, null, 2));
          '

      - name: List generated artifacts
        run: ls -la dist

      - name: Upload installer and manifest
        uses: actions/upload-artifact@v7
        with:
          name: orchestra-windows
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/latest.json
          if-no-files-found: error
          retention-days: 7
