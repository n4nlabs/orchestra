name: Build do Instalador (Windows)

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Conferir variáveis do repositório
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_PUBLIC_URL" ]; then
            echo "::error::A variável 'R2_PUBLIC_URL' não está configurada no repositório (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Conferir versão do package.json contra a tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "::error::package.json está em $PKG_VERSION mas a tag é $TAG. O instalador sairia com a versão errada e o auto-update quebraria."
            exit 1
          fi

      - name: Build do instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Gerar latest.json
        env:
          TAG: ${{ inputs.tag }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist/
          git log -1 --format=%b > dist/notes.md
          node -e '
            const fs = require("node:fs");
            const setup = fs.readdirSync("dist").find((f) => f.endsWith("-setup.exe"));
            const manifest = {
              version: process.env.TAG.replace(/^v/, ""),
              notes: fs.readFileSync("dist/notes.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(`dist/${setup}.sig`, "utf8").trim(),
                  url: `${process.env.R2_PUBLIC_URL}/releases/${setup}`,
                },
              },
            };
            fs.writeFileSync("dist/latest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Listar artefatos gerados
        run: ls -la dist

      - name: Guardar instalador e manifest
        uses: actions/upload-artifact@v7
        with:
          name: orchestra-windows
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/latest.json
          if-no-files-found: error
          retention-days: 7
