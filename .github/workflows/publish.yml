name: Publish to R2

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: orchestra-windows
          path: dist

      - name: Check files
        run: ls -la dist

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: releases
        run: |
          set -euo pipefail
          DEST="s3://${R2_BUCKET}/${R2_PREFIX}"

          for f in dist/*-setup.exe dist/*-setup.exe.sig; do
            echo "Uploading $(basename "$f")"
            aws s3 cp "$f" "$DEST/$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          echo "Uploading latest.json"
          aws s3 cp dist/latest.json "$DEST/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache, max-age=0" \
            --content-type "application/json"

      - name: Verify public latest.json
        env:
          TAG: ${{ inputs.tag }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}/releases
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error "$PUBLIC_URL/latest.json?t=$(date +%s)" | tee latest.remote.json
          grep -q "\"version\": \"${TAG#v}\"" latest.remote.json \
            || { echo "::error::public latest.json is not at version ${TAG#v}"; exit 1; }
          echo "Published: ${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          jq -r '.notes' dist/latest.json > notes.md
          gh release create "$TAG" dist/*-setup.exe dist/*-setup.exe.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
