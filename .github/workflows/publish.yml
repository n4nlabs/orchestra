name: Publicar no R2

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos do build
        uses: actions/download-artifact@v8
        with:
          name: orchestra-windows
          path: dist

      - name: Conferir arquivos
        run: ls -la dist

      - name: Enviar para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: releases
        run: |
          set -euo pipefail
          DEST="s3://${R2_BUCKET}/${R2_PREFIX}"

          for f in dist/*-setup.exe dist/*-setup.exe.sig; do
            echo "Enviando $(basename "$f")"
            aws s3 cp "$f" "$DEST/$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          echo "Enviando latest.json"
          aws s3 cp dist/latest.json "$DEST/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache, max-age=0" \
            --content-type "application/json"

      - name: Verificar latest.json público
        env:
          TAG: ${{ inputs.tag }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}/releases
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error "$PUBLIC_URL/latest.json?t=$(date +%s)" | tee latest.remote.json
          grep -q "\"version\": \"${TAG#v}\"" latest.remote.json \
            || { echo "::error::latest.json público não está na versão ${TAG#v}"; exit 1; }
          echo "Publicado: ${TAG}"
