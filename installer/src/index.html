<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchestra</title>
  <link rel="stylesheet" href="installer.css" />
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="grow" data-tauri-drag-region></div>
    <button type="button" class="wclose" id="wClose" aria-label="Fechar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
  </header>

  <div class="shell">
    <aside class="panel" data-tauri-drag-region>
      <div class="p-top" data-tauri-drag-region>
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="4" height="12" rx="1.6"/><rect x="10" y="3" width="4" height="18" rx="1.6"/><rect x="17" y="8" width="4" height="9" rx="1.6"/></svg></span>
        <div class="p-name" data-tauri-drag-region>Orchestra</div>
        <div class="p-tag" id="pTag" data-tauri-drag-region></div>
      </div>
      <div class="eq" id="eq" aria-hidden="true"></div>
      <div class="p-ver" id="pVer"></div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="installer.js"></script>
</body>
</html>
